name: sanity
description: Render your website with sanity and optionally push it to GitHub
  Pages and/or Neocities
author: nonk123

inputs:
  push:
    description: Also push the website to GitHub pages?
    default: "false"

  neocities_secret:
    description: |
      WARNING: this nukes your Neocities site's contents and replaces them with the output of sanity.

      Set this to your Neocities API key to push to Neocities. Refer to <https://github.com/bcomnes/deploy-to-neocities> for instructions on how to obtain one.

  neocities_supporter:
    description: Set this to true if you are a Neocities Supporter. Bypasses certain
      (unspecified) file limits.
    default: "false"

outputs:
  page_url:
    # _ instead of - for actions/deploy-pages compatibility
    description: Output page URL if `push` was set to `true`
    value: ${{ inputs.push && steps.publish-ghp.outputs.page_url || '' }}

runs:
  using: composite
  steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6
      if: inputs.push

    - name: Choose a temporary path to house sanity
      id: choose-tmp
      shell: bash
      run: echo "path=$(mktemp $RUNNER_TEMP/sanity.XXXXXX)" >> $GITHUB_OUTPUT

    - name: Download sanity
      shell: bash
      run: |
        wget -nv $SANITY_URL -O ${{ steps.choose-tmp.outputs.path }} \
          && chmod +x ${{ steps.choose-tmp.outputs.path }}
      env:
        SANITY_URL: https://github.com/nonk123/sanity/releases/latest/download/sanity-${{
          runner.os == 'Windows' && 'windows.exe' || 'linux' }}

    - name: Render the website
      shell: bash
      run: env RUST_LOG=debug ${{ steps.choose-tmp.outputs.path }}

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v5
      with: { path: dist }
      if: inputs.push

    - name: Publish to GitHub Pages
      id: publish-ghp
      uses: actions/deploy-pages@v5
      if: inputs.push

    - name: Publish to Neocities
      uses: bcomnes/deploy-to-neocities@v3
      if: inputs.neocities_secret
      with:
        api_key: ${{ inputs.neocities_secret }}
        neocities_supporter: ${{ inputs.neocities_supporter }}
        cleanup: true
        preview_before_deploy: true
        dist_dir: dist
